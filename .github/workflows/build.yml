name: Build app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: dmg
          - os: ubuntu-latest
            bundle: appimage
          - os: ubuntu-latest
            bundle: deb
          - os: ubuntu-latest
            bundle: rpm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install rpm-build
        if: matrix.bundle == 'rpm'
        run: sudo apt-get install -y rpm

      - name: Build Tauri app
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Bundle macOS uninstaller
        if: startsWith(matrix.os, 'macos')
        run: |
          cp scripts/uninstall.sh src-tauri/target/release/bundle/dmg/
          chmod +x src-tauri/target/release/bundle/dmg/uninstall.sh

      - name: Bundle AppImage uninstaller
        if: matrix.bundle == 'appimage'
        run: |
          cp scripts/uninstall-appimage.sh src-tauri/target/release/bundle/appimage/
          chmod +x src-tauri/target/release/bundle/appimage/uninstall-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pomidori-clock-${{ matrix.os }}-${{ matrix.bundle }}
          path: |
            src-tauri/target/release/bundle/

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0
          accept-android-sdk-licenses: true

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Add Android targets to Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android APK
        run: npm run tauri android build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: pomidori-clock-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          files=$(find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.apk" -o -name "uninstall*.sh" \) | tr '\n' ' ')
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pomidori Clock $tag" \
            --generate-notes \
            $files
